baseURL: "https://davidvossebuerger.github.io/"
title: David Vossebürger
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: Papers
          url: papers/
          weight: 2
        - name: Projects
          url: projects/
          weight: 3
        - name: Certificates
          url: certificates/
          weight: 4
        - name: CV
          url: cv/
          weight: 5

params:
    description: "Research papers, projects, certificates, and contact details for David Vossebürger."
    author: David Vossebürger
    # googleAnalyticsID: G-XXXXX
    DateFormat: January 2006
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: [papers, projects, certificates]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: David Vossebürger
          imageUrl: picture.svg
          imageWidth: 160
          imageHeight: 160
          buttons: []

    socialIcons:
        - name: CV
          url: cv/
          params:
            title: "View CV"
            icon: |
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
        - name: Email
          url: mailto:david.vossebuerger@proton.me
        - name: GitHub
          url: https://github.com/DavidVossebuerger
        - name: SSRN
          url: https://ssrn.com/author=10722256
        - name: Google Scholar
          url: https://scholar.google.com/citations?view_op=list_works&hl=en&user=bLv4KQgAAAAJ
        - name: Discord
          url: https://discord.com/users/1007581424167161857

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: David Vossebürger
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2